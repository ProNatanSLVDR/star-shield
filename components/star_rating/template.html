{% load i18n %}
<div class="star-rating d-inline-flex align-items-center gap-2" data-readonly="{{ readonly|yesno:'true,false' }}">
    <div class="btn-group" role="group" aria-label="{% trans "Sélection de la note" %}" data-controller="star-rating">
        {% for star in stars %}
            <input type="radio"
                   class="btn-check"
                   name="{{ input_id }}_stars"
                   id="{{ input_id }}_star_{{ star }}"
                   value="{{ star }}"
                   {% if rating == star %}checked{% endif %}
                   {% if readonly %}disabled{% endif %}>
            <label class="btn btn-outline-warning px-2" for="{{ input_id }}_star_{{ star }}">
                <span class="fs-4" aria-hidden="true">&#9733;</span>
            </label>
        {% endfor %}
    </div>
    <input type="hidden" name="rating" id="{{ input_id }}" value="{{ rating }}">
</div>

{% if not readonly %}
    <script>
        (function() {
            const wrapper = document.currentScript.previousElementSibling;
            if (!wrapper || wrapper.dataset.readonly === "true") {
                return;
            }

            const hiddenInput = wrapper.querySelector(`input[type="hidden"]`);
            const radios = wrapper.querySelectorAll(`input[type="radio"]`);

            radios.forEach(radio => {
                radio.addEventListener("change", () => {
                    hiddenInput.value = radio.value;
                });
            });

        // Ensure clicking on already-selected star keeps value
            wrapper.addEventListener("click", (event) => {
                const target = event.target.closest("label");
                if (!target) return;
                const forId = target.getAttribute("for");
                if (!forId) return;
                const input = wrapper.querySelector(`#${forId}`);
                if (input) {
                    hiddenInput.value = input.value;
                }
            });
        })();
    </script>
{% endif %}
