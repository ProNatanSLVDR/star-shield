<li class="nav-item">
    <button class="nav-link px-3 w-100 text-start border-0 bg-transparent d-flex align-items-center justify-content-between"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#{{ collapse_id }}"
            id="{{ collapse_id }}-trigger">
        <span>
            <i class="{{ icon }} pe-1"></i>
            {{ text }}
        </span>
        <div id="{{ collapse_id }}-chevron-down" class="d-none">
            <i class="fa-solid fa-chevron-down small"></i>
        </div>
        <div id="{{ collapse_id }}-chevron-up">
            <i class="fa-solid fa-chevron-up small"></i>
        </div>
    </button>
    <div class="collapse" id="{{ collapse_id }}" data-collapse-state="closed">
        <ul class="nav nav-pills flex-column ps-3">
            {% slot navlinks %}{% endslot %}
        </ul>
    </div>
</li>

<script>
    (function() {
        const collapseId = "{{ collapse_id }}";
        const collapse = document.getElementById(collapseId);
        const trigger = document.getElementById(collapseId + "-trigger");
        const chevronDown = document.getElementById(collapseId + "-chevron-down");
        const chevronUp = document.getElementById(collapseId + "-chevron-up");

        if (!collapse || !trigger) {
            return;
        }

    // Function to update chevron based on state
        function updateChevron(isOpen) {
            console.log('updateChevron', isOpen);
            if (isOpen) {
                chevronDown.classList.add('d-none');
                chevronUp.classList.remove('d-none');
            } else {
                chevronUp.classList.add('d-none');
                chevronDown.classList.remove('d-none');
            }
        }

    // Function to update collapse state based on data-collapse-state attribute
        function syncCollapseState() {
            const state = collapse.getAttribute('data-collapse-state');
            const isOpen = state === 'open';

            console.log('syncCollapseState', state, isOpen);

            if (isOpen) {
                collapse.classList.add('show');
                updateChevron(true);
            } else if (!isOpen) {
                collapse.classList.remove('show');
                updateChevron(false);
            }
        }



    // Handle Bootstrap collapse events
        collapse.addEventListener('show.bs.collapse', function() {
            collapse.setAttribute('data-collapse-state', 'open');
            updateChevron(true);
        });

        collapse.addEventListener('hide.bs.collapse', function() {
            collapse.setAttribute('data-collapse-state', 'closed');
            updateChevron(false);
        });

    // Initial sync
        syncCollapseState();

    // Watch for data-collapse-state changes
        const observer = new MutationObserver(function() {
            syncCollapseState();
            console.log('data-collapse-state changed');
        });
        observer.observe(collapse, {
            attributes: true,
            attributeFilter: ['data-collapse-state']
        });
    })();
</script>
