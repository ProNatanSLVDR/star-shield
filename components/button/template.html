{% if href %}
    <a href=" {% slot href %} {% endslot %} " class="btn {{classes}}">
        {% if icon %}
            <i class="{{icon}}"></i>
        {% endif %}
        {% if text %}
            {{text}}
        {% endif %}
    </a>
{% else %}
    <button class="btn {{classes}}">
        {% if icon %}
            <i class="{{icon}}"></i>
        {% endif %}
        {% if text %}
            {{text}}
        {% endif %}
    </button>
{% endif %}
