{% if href %}
    <a href=" {% slot href %} {% endslot %} " class="btn {{classes}} {% if disabled %}disabled{% endif %}"
       {% for key, value in extra_kwargs.items %}
           {{ key }}="{{ value }}"
       {% endfor %}
    >
        {% if icon %}
            <i class="{{icon}}"></i>
        {% endif %}
        {% if text %}
            {{text}}
        {% endif %}
    </a>
{% else %}
    <button class="btn {{classes}} {% if disabled %}disabled{% endif %}"
            {% for key, value in extra_kwargs.items %}
                {{ key }}="{{ value }}"
            {% endfor %}
            {% if default_hx_modal %}
                hx-target="#dynamicModal .modal-content"
                data-bs-toggle="modal"
                data-bs-target="#dynamicModal"
            {% endif %}
            {% if modal_close %}
                data-bs-dismiss="modal"
            {% endif %}
    >
        {% if icon %}
            <i class="{{icon}}"></i>
        {% endif %}
        {% if text %}
            {{text}}
        {% endif %}
    </button>
{% endif %}
