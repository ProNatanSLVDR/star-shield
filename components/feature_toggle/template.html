<div id="feature-header-toggle"
     class="d-flex align-items-center gap-2 px-3 py-2 rounded-3 border flex-shrink-0
            {% if feature_enabled %}
                bg-success-subtle border-success
            {% else %}
                bg-danger-subtle border-danger
            {% endif %}"
     hx-post="{% url 'dashboard:etablissement:settings:toggle_single_feature' %}"
     hx-vals='{"feature": "{{ feature_field }}"}'
     hx-target="#feature-header-toggle"
     hx-swap="outerHTML"
     hx-confirm="{% if feature_enabled %}Désactiver cette fonctionnalité ?{% else %}Activer cette fonctionnalité ?{% endif %}"
     hx-confirm-cancel-reload="true">
    {% csrf_token %}
    <span class="fw-semibold small text-body-emphasis">
        <i class="{{ icon }} me-1"></i>
        {{ feature_name }}
    </span>
    <span class="badge rounded-pill
                 {% if feature_enabled %}
                     bg-success
                 {% else %}
                     bg-danger
                 {% endif %}">
        {% if feature_enabled %}
            Activé
        {% else %}
            Désactivé
        {% endif %}
    </span>
    <div class="form-check form-switch mb-0 ms-auto"
         style="padding: 0; min-height: 0">
        <input type="checkbox"
               class="form-check-input float-none"
               role="button"
               style="width: 2.5rem;
                      height: 1.5rem;
                      margin: 0;
                      cursor: pointer;
                      {% if feature_enabled %}
                          background-color: var(--bs-success);
                          border-color: var(--bs-success);
                      {% else %}
                          border-color: var(--bs-danger);
                      {% endif %}"
               {% if feature_enabled %}checked{% endif %}>
    </div>
</div>
