{% load component_tags %}
<div class="{% if component_vars.is_filled.actions %}
                d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2
            {% endif %}
            mb-3">
    <div>
        <h1 class="h4 fw-bold text-body-emphasis mb-1">
            <i class="{{ icon }} me-2"></i>{{ title }}
        </h1>
        <p class="text-muted mb-0 small">{{ subtitle }}</p>
    </div>
    {% if component_vars.is_filled.actions %}
        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-3 flex-shrink-0 align-self-stretch align-self-md-auto">
            {% slot "actions" %}
            {% endslot %}
        </div>
    {% endif %}
</div>
