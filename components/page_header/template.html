{% load component_tags %}
<div class="{% if component_vars.is_filled.actions %}d-flex flex-column flex-md-row align-items-start justify-content-between gap-2{% endif %} mb-3">
    <div>
        <h1 class="h4 fw-bold text-body-emphasis mb-1">
            <i class="{{ icon }} me-2"></i>{{ title }}
        </h1>
        <p class="text-muted mb-0 small">{{ subtitle }}</p>
    </div>
    {% if component_vars.is_filled.actions %}
        <div class="d-flex align-items-center gap-3 flex-shrink-0">
            {% slot "actions" %}{% endslot %}
        </div>
    {% endif %}
</div>
