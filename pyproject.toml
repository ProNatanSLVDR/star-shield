[tool.djlint]
format_css=true
ignore="H021"
format_js=true
blank_line_after_tag="extends,endblock"
blank_line_before_tag="extends,block"
custom_blocks="component,endcomponent,fill,slot"
format_attribute_template_tags=true
profile="django"
max_attribute_length=10
max_line_length=80


[tool.djlint.js]
templating="django"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",

    "C4", 
    "DTZ",
    "DJ",
    "EM",
    "T20",
    "LOG",
    "RET",
    "N",
    "PERF",
    "RUF"
]

ignore = [
    "SIM108",
    "DJ001",
]


[tool.ruff.format]
quote-style = "double"


