{% extends "base.html" %}
{% load i18n %}

{% block body %}
    <section class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow-sm border-0 rounded-4 text-center p-5">
                        <div class="display-4 mb-3 text-success">
                            <i class="fa-solid fa-face-smile"></i>
                        </div>
                        <h1 class="h3 mb-3">{% trans "Merci pour votre avis !" %}</h1>
                        <p class="text-muted mb-4">{% trans "Merci d'avoir pris le temps de partager votre expérience. Notre équipe l'examinera rapidement." %}</p>
                    </div>

                    <p class="text-muted text-center mt-4 mb-0 small">
                        {% trans "TODO : Personnaliser ce message de remerciement." %}
                    </p>
                </div>
            </div>
        </div>
    </section>
{% endblock body %}
