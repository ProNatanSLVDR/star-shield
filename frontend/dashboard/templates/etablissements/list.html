{% extends "dashboard_base.html" %}

{% block dashboard_content %}

    <div class="mb-3">
        <h1 class="h4 fw-bold text-body-emphasis mb-1">
            <i class="fa-solid fa-building me-2"></i>
            Vos établissements
        </h1>
        <p class="text-muted mb-0 small">Un établissement représente votre entreprise ou lieu d'affaires sur Google. Gérez tous vos établissements depuis cette page.</p>
    </div>

    <div hx-get="{% url 'dashboard:etablissements:list' %}"
         hx-trigger="load, etablissements-updated from:body"
         hx-swap="morph:innerHTML"
         id="etablissementsTable">
    </div>
{% endblock %}
