steps:
  - id: build-docker-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '-t'
      - '${_IMAGE_NAME}'
      - '-f'
      - './tasks_api/Dockerfile'
      - '.'

  - id: push-image-to-artifact-registry
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'

  - id: deploy-to-cloud-run
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '--region'
      - '${_REGION}'

  - id: execute-migrations-job
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - ${_JOB_NAME}
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '--region=${_REGION}'
      - '--execute-now'
      - '--wait'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
    _REPO_NAME: prod-builds
    _IMAGE_NAME: tasks-api
    _SERVICE_NAME: tasks-api
    _TAG: latest
    _REGION: europe-west1
    _JOB_NAME: migrate-prod