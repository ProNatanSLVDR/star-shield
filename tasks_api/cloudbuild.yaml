steps:
  - name: Build image
    args:
      - build
      - '-t'
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'
      - '-f'
      - './tasks_api/Dockerfile'
      - '.'
  - name: Push to registry
    args:
      - push
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'

images:
  - 'europe-west9-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
    _REPO_NAME: production-builds
    _IMAGE_NAME: tasks-api
    