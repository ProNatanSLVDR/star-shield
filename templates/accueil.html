{% extends "dashboard_base.html" %}

{% block dashboard_content %}
    <section class="space-y-4">
        <header>
            <h1 class="text-2xl font-semibold text-slate-900">Tableau de bord</h1>
            <p class="text-sm text-slate-600">Bienvenue sur votre espace StarShield.</p>
        </header>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <article class="rounded-lg border border-indigo-100 bg-white/80 p-4 shadow-sm">
                <h2 class="text-lg font-medium text-slate-900">Résumé</h2>
                <p class="text-sm text-slate-600">Ajoutez ici vos informations principales.</p>
            </article>
            <article class="rounded-lg border border-indigo-100 bg-white/80 p-4 shadow-sm">
                <h2 class="text-lg font-medium text-slate-900">Actions rapides</h2>
                <p class="text-sm text-slate-600">Créez des raccourcis pour vos actions fréquentes.</p>
            </article>
        </div>
    </section>
{% endblock %}
