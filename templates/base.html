{% load static %}

<!DOCTYPE html>
<html lang="fr" class="h-100">
    <head>
        <title>StarShield</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <link rel="stylesheet" href="{% static 'bootstrap/bootstrap.min.css' %}">

        <script defer src="{% static 'icons/brands.min.js' %}"></script>
        <script defer src="{% static 'icons/solid.min.js' %}"></script>
        <script defer src="{% static 'icons/fontawesome.min.js' %}"></script>

        <div data-toast-container class="position-fixed bottom-0 end-0 p-4 d-flex flex-column gap-3 align-items-end" style="width: 400px; z-index: 1100;">
            <div data-toast-template class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="min-width: 100%;">
                <div class="toast-header">
                    <strong class="me-auto fs-5" data-toast-title></strong>
                    <small class="fs-6" data-toast-time></small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div data-toast-body class="toast-body fs-6"></div>
            </div>
        </div>
        <script src="{% static 'custom/toasts.js' %}"></script>

    </head>

    <body class="h-100" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>

        {% block body %}
        {% endblock body %}

    </body>

    <script type="text/javascript" src="{% static 'htmx/htmx.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'htmx/htmx.idiomorph.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@joint/core/dist/joint.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))


                // Handle messages for regular requests
            {% if messages and not request.htmx %}
                {% for message in messages %}
                    createToast({
                        message: '{{ message.message }}',
                        tags: '{{ message.tags }}'
                    });
                {% endfor %}
            {% endif %}

                // Handle messages from X-Messages header for HTMX requests
            htmx.on("htmx:afterRequest", (e) => {
                const messages = e.detail.xhr.getResponseHeader("X-Messages");
                if (messages) {
                    JSON.parse(messages).forEach(createToast);
                }
            });

            htmx.on("close-modal", (e) => {
                const modals = document.querySelectorAll('.modal');
                modals.forEach(modalEl => {
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) {
                        modal.hide();
                    }
                });
            })

            // Handle modal loading states
            htmx.on("htmx:beforeRequest", (e) => {
                const elt = e.detail.elt;
                // Get the target from the triggering element
                const targetSelector = elt.getAttribute('hx-target');
                let target = null;

                if (targetSelector) {
                    // Check if target selector matches modal content
                    if (targetSelector.includes('#dynamicModal .modal-content') || targetSelector.includes('#dynamicModal2 .modal-content')) {
                        // Resolve target selector directly
                        target = document.querySelector(targetSelector);
                    }
                }

                // Check if target is modal content
                if (target && (target.matches('#dynamicModal .modal-content') || target.matches('#dynamicModal2 .modal-content'))) {
                    // Store existing content and hide it
                    const existingContent = Array.from(target.children);
                    existingContent.forEach(el => {
                        el.style.display = 'none';
                    });

                    // Create and show loader
                    const loader = document.createElement('div');
                    loader.className = 'modal-loader d-flex justify-content-center align-items-center py-5';
                    loader.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Chargement...</span></div>';
                    target.appendChild(loader);

                    // Store loader reference for cleanup
                    target.dataset.loaderActive = 'true';
                }
            });

            htmx.on("htmx:afterSwap", (e) => {
                const target = e.detail.target;
                // Check if target is modal content
                if (target && (target.matches('#dynamicModal .modal-content') || target.matches('#dynamicModal2 .modal-content'))) {
                    // Remove loader if it exists (should be removed by swap, but ensure cleanup)
                    const loader = target.querySelector('.modal-loader');
                    if (loader) {
                        loader.remove();
                    }
                    target.removeAttribute('data-loader-active');
                }
            });

            // Handle errors - hide loader on error
            htmx.on("htmx:responseError", (e) => {
                const target = e.detail.target;
                if (target && (target.matches('#dynamicModal .modal-content') || target.matches('#dynamicModal2 .modal-content'))) {
                    const loader = target.querySelector('.modal-loader');
                    if (loader) {
                        loader.remove();
                    }
                    target.removeAttribute('data-loader-active');
                    // Show existing content again on error (if swap didn't happen)
                    const existingContent = Array.from(target.children);
                    existingContent.forEach(el => {
                        if (!el.classList.contains('modal-loader')) {
                            el.style.display = '';
                        }
                    });
                }
            });

            // Handle request cancellation
            htmx.on("htmx:sendError", (e) => {
                const target = e.detail.target;
                if (target && (target.matches('#dynamicModal .modal-content') || target.matches('#dynamicModal2 .modal-content'))) {
                    const loader = target.querySelector('.modal-loader');
                    if (loader) {
                        loader.remove();
                    }
                    target.removeAttribute('data-loader-active');
                    // Show existing content again
                    const existingContent = Array.from(target.children);
                    existingContent.forEach(el => {
                        if (!el.classList.contains('modal-loader')) {
                            el.style.display = '';
                        }
                    });
                }
            });
        });
    </script>

    {% include "confirmation_modal.html" %}
</html>
