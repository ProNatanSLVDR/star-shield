<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">
                    <i class="fa-solid fa-circle-question pe-2"></i>
                    Confirmation
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="confirmationMessage" class="mb-0"></p>
            </div>
            <div class="modal-footer">
                {% component "button"
                text="Confirmer"
                type="button"
                class_name="btn-danger"
                icon="fa-solid fa-check"
                kwargs={
                "id": "confirmationConfirmBtn"
                }
                /%}
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const confirmationModal = document.getElementById('confirmationModal');
        const bsConfirmationModal = new bootstrap.Modal(confirmationModal);
        let previousModal = null;

        // Override HTMX's default confirm behavior
        htmx.on('htmx:confirm', function(evt) {
            if (!evt.detail.question) return;

            evt.preventDefault();

            // Find any currently open modal
            const openModals = document.querySelectorAll('.modal.show');
            openModals.forEach(modal => {
                if (modal.id !== 'confirmationModal') {
                    previousModal = bootstrap.Modal.getInstance(modal);
                    if (previousModal) {
                        previousModal.hide();
                    }
                }
            });

            const messageEl = document.getElementById('confirmationMessage');
            const confirmBtn = document.getElementById('confirmationConfirmBtn');
            const closeBtn = confirmationModal.querySelector('.btn-close');

            // Get reopen behavior from the triggering element
            const shouldReopen = evt.detail.elt.getAttribute('hx-confirm-reopen') !== 'false';

            // Set the confirmation message
            messageEl.textContent = evt.detail.question;

            // Handle confirmation
            confirmBtn.onclick = function() {
                bsConfirmationModal.hide();
                evt.detail.issueRequest(true);
            };

            // Handle modal close button
            closeBtn.onclick = function() {
                if (previousModal && shouldReopen) {
                    previousModal.show();
                    previousModal = null;
                }
            };

            // Show the confirmation modal
            bsConfirmationModal.show();
        });
    });
</script>
