{% extends "base.html" %}

{% block content %}
    <div class="bg-body-tertiary w-100 h-100">

        <!-- Sidebar -->
        <section class="vh-100 d-flex p-2" style="width: 275px;">
            <div class="card border-0 shadow-lg rounded-4 flex-fill d-flex flex-column overflow-hidden">

                <!-- Header -->
                <div class="position-relative px-4 px-lg-4 py-4 bg-primary bg-gradient text-white">
                    <div class="position-absolute top-0 end-0 translate-middle opacity-25 d-none d-sm-block">
                        <span class="d-inline-flex border border-light border-2 rounded-circle p-3"></span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <div>
                            <h1 class="h4 mb-0 text-white">StarShield</h1>
                        </div>
                        <span class="d-none d-sm-inline-flex text-white-50 fs-4">
                            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        </span>
                    </div>
                </div>

                <!-- Sidebar Content -->
                <div class="card-body p-0 bg-white d-flex flex-column flex-grow-1">
                    <div class="p-3 mb-auto">
                        {% block sidebar_content %}
                            {% include "sidebar_main.html" %}
                        {% endblock %}
                    </div>
                    <div class="p-3 border-top border-light-subtle bg-body-tertiary">

                    </div>
                </div>
            </div>
        </section>
    </div>
{% endblock content %}
