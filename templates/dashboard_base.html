{% extends "base.html" %}
{% load i18n %}

{% block body %}
    <div class="d-flex w-100 h-100 bg-body-tertiary">

        <!-- Desktop Sidebar (visible on md and above) -->
        <aside class="d-none d-lg-flex flex-column bg-white border-end flex-shrink-0" style="width: 280px; height: 100%; overflow: hidden;">
            {% include "sidebar_base.html" with is_offcanvas=False %}
        </aside>

        <!-- Mobile Offcanvas Sidebar (hidden on md and above) -->
        <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="sidebarOffcanvas" style="width: 280px;">
            {% include "sidebar_base.html" with is_offcanvas=True %}
        </div>

        <!-- Main Content -->
        <main class="d-flex flex-column flex-grow-1 p-3 h-100">
            {% block dashboard_content %}
            {% endblock dashboard_content %}

        </main>

        <!-- Floating Mobile Menu Button -->
        <button class="btn btn-primary d-lg-none position-fixed bottom-0 end-0 m-4 rounded-circle shadow-lg"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarOffcanvas"
                style="width: 56px; height: 56px; z-index: 1050;">
            <i class="fa-solid fa-bars fs-5"></i>
        </button>
    </div>



{% endblock body %}
